name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, resolved 2026-09-12
        with:
          bun-version: 1.3.10
      - run: bun test
  swift-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile helpers without launching them
        run: |
          swiftc -O widget/sysvol.swift -o "$RUNNER_TEMP/sysvol"
          swiftc -O widget/spaces-tap.swift -o "$RUNNER_TEMP/spaces-tap"
          swiftc -O widget/SpacesWidget.swift -o "$RUNNER_TEMP/spaces-widget"
